<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("campusai_theme") || localStorage.getItem("campusai_theme_v1");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
